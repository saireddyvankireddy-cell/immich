
name: Kaki Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native code prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libclang-dev libssl-dev protobuf-compiler

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install mise and project toolchains
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install mobile dependencies and generate code
        run: |
          mise run //mobile:install:ci
          mise run //mobile:codegen

      - name: Validate Kaki source
        working-directory: mobile
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/presentation/pages/search/search.page.dart \
            lib/presentation/pages/search/kaki_gallery_filters.dart \
            lib/presentation/widgets/backup/kaki_backup_health.widget.dart \
            lib/pages/backup/backup.page.dart \
            test/presentation/pages/search/kaki_gallery_filters_test.dart
          dart analyze \
            lib/presentation/pages/search/search.page.dart \
            lib/presentation/pages/search/kaki_gallery_filters.dart \
            lib/presentation/widgets/backup/kaki_backup_health.widget.dart \
            lib/pages/backup/backup.page.dart \
            test/presentation/pages/search/kaki_gallery_filters_test.dart
          flutter test \
            test/presentation/pages/search/kaki_gallery_filters_test.dart \
            test/presentation/pages/search_page_test.dart \
            test/providers/backup/backup_provider_test.dart

      - name: Build Kaki Android debug APK
        working-directory: mobile
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload Kaki APK
        uses: actions/upload-artifact@v4
        with:
          name: kaki-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
