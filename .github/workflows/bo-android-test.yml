
name: Kaki Android APK

on:
  push:
    branches:
      - bo-immich-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native code prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libclang-dev libssl-dev protobuf-compiler

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install mise and project toolchains
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install mobile dependencies and generate code
        run: |
          mise run //mobile:install:ci
          mise run //mobile:codegen

      - name: Apply Kaki changes (3 features)
        shell: bash
        run: |
          python3 - <<'KAKI_PATCH_SCRIPT'
          from pathlib import Path
          import math
          import struct
          import zlib

          ROOT = Path('mobile')

          def edit(name, old, new):
              f = ROOT / name
              original = f.read_text()
              if original.count(old) != 1:
                  raise SystemExit(
                      f'Kaki patch stopped: expected one anchor '
                      f'in {f}, found {original.count(old)}'
                  )
              f.write_text(original.replace(old, new, 1))
              print('Patched', f)

          # FEATURE 1: KAKI BRANDING
          # Preserve package ID, authentication, and server connection.

          edit(
              'android/app/build.gradle',
              'resValue "string", "app_name", "Immich"',
              'resValue "string", "app_name", "Kaki"',
          )

          edit(
              'android/app/src/main/res/values/strings.xml',
              'See memories from Immich.',
              'See memories from Kaki.',
          )

          manifest = ROOT / 'android/app/src/main/AndroidManifest.xml'
          ms = manifest.read_text()

          if 'android:label="Upload to Immich"' not in ms:
              raise SystemExit('Expected Android sharing label not found')

          ms = ms.replace(
              'android:label="Upload to Immich"',
              'android:label="Upload to Kaki"',
          ).replace(
              'android:label="View in Immich"',
              'android:label="View in Kaki"',
          )
          manifest.write_text(ms)

          vector = '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
              android:fillColor="#FFF6EA"
              android:pathData="M30,26 L42,26 L42,49 L64,26 L79,26 L55,52 L81,82 L65,82 L42,56 L42,82 L30,82 Z"/>
            <path
              android:fillColor="#F5BE68"
              android:pathData="M80,30 a7,7 0,1 0,0.1 0 Z"/>
          </vector>
          '''

          drawable = ROOT / 'android/app/src/main/res/drawable'

          (drawable / 'ic_launcher_foreground.xml').write_text(vector)

          (drawable / 'ic_launcher_monochrome.xml').write_text(
              vector.replace(
                  '#FFF6EA', '#FFFFFFFF'
              ).replace(
                  '#F5BE68', '#FFFFFFFF'
              )
          )

          edit(
              'android/app/src/main/res/values/colors.xml',
              '#ffffff',
              '#8D3E20',
          )

          def point_dist(x, y, ax, ay, bx, by):
              dx = bx - ax
              dy = by - ay
              t = max(
                  0,
                  min(
                      1,
                      ((x - ax) * dx + (y - ay) * dy)
                      / (dx * dx + dy * dy)
                  )
              )
              return math.hypot(
                  x - ax - t * dx,
                  y - ay - t * dy
              )

          def png(size):
              data = bytearray()

              for yi in range(size):
                  data.append(0)
                  y = (yi + 0.5) / size

                  for xi in range(size):
                      x = (xi + 0.5) / size

                      k = (
                          (.27 <= x <= .38 and .20 <= y <= .80)
                          or point_dist(
                              x, y, .365, .52, .68, .22
                          ) < .066
                          or point_dist(
                              x, y, .365, .49, .70, .79
                          ) < .066
                      )

                      circle = (
                          (x - .77)**2 + (y - .27)**2
                          < .065**2
                      )

                      data.extend(
                          (255, 246, 234) if k
                          else (245, 190, 104) if circle
                          else (141, 62, 32)
                      )

              def chunk(kind, body):
                  return (
                      struct.pack('>I', len(body))
                      + kind
                      + body
                      + struct.pack(
                          '>I',
                          zlib.crc32(kind + body) & 0xffffffff
                      )
                  )

              return (
                  b'\x89PNG\r\n\x1a\n'
                  + chunk(
                      b'IHDR',
                      struct.pack(
                          '>2I5B',
                          size, size, 8, 2, 0, 0, 0
                      )
                  )
                  + chunk(
                      b'IDAT',
                      zlib.compress(data, 9)
                  )
                  + chunk(b'IEND', b'')
              )

          for dpi, size in [
              ('mdpi', 48),
              ('hdpi', 72),
              ('xhdpi', 96),
              ('xxhdpi', 144),
              ('xxxhdpi', 192),
          ]:
              path = ROOT / (
                  f'android/app/src/main/res/'
                  f'mipmap-{dpi}/ic_launcher.png'
              )
              path.write_bytes(png(size))

          # FEATURE 2: SMART GALLERY FILTERS
          # Reuse existing Immich search functionality.

          search_file = 'lib/presentation/pages/search/search.page.dart'

          edit(
              search_file,
              "import 'dart:async';",
              "import 'dart:async';\n"
              "import 'package:flutter_secure_storage/flutter_secure_storage.dart';",
          )

          edit(
              search_file,
              '    final dateInputFilter = useState<DateFilterInputModel?>(null);',
              '''    final dateInputFilter = useState<DateFilterInputModel?>(null);
              final kakiPresets = useState<List<String>>([]);
              final kakiStorage = FlutterSecureStorage();

              useEffect(() {
                unawaited(
                  kakiStorage.read(
                    key: 'kaki.saved_filters.v1'
                  ).then((value) {
                    if (context.mounted && value != null) {
                      kakiPresets.value = value
                          .split('|')
                          .where((item) => item.isNotEmpty)
                          .toList();
                    }
                  }),
                );
                return null;
              }, const []);''',
          )

          edit(
              search_file,
              '    return Scaffold(\n      resizeToAvoidBottomInset: false,',
              '''    void applyKakiFilter(String preset) {
                if (preset == 'All') {
                  AutoTabsRouter.of(context).setActiveIndex(0);
                  return;
                }

                final now = DateTime.now();
                final thisMonth =
                    preset == 'This Month' ||
                    preset == 'This Month Photos';

                final after = thisMonth
                    ? DateTime(now.year, now.month)
                    : null;

                final before = thisMonth
                    ? DateTime(now.year, now.month + 1)
                    : null;

                final current = filter.value;

                search(current.copyWith(
                  mediaType: switch (preset) {
                    'Videos' || 'Favorite Videos' => AssetType.video,
                    'Photos' || 'Favorite Photos' ||
                      'This Month Photos' => AssetType.image,
                    _ => AssetType.other,
                  },
                  display: current.display.copyWith(
                    isFavorite:
                        preset == 'Favorites' ||
                        preset.startsWith('Favorite '),
                  ),
                  filename: preset == 'Screenshots (filename)'
                      ? 'Screenshot'
                      : null,
                  date: SearchDateFilter(
                    takenAfter: after,
                    takenBefore: before,
                  ),
                ));
              }

              return Scaffold(
                resizeToAvoidBottomInset: false,''',
          )

          edit(
              search_file,
              '''      body: CustomScrollView(
                slivers: [
                  SliverPadding(''',
              '''      body: CustomScrollView(
                slivers: [
                  SliverToBoxAdapter(
                    child: Padding(
                      padding: const EdgeInsets.fromLTRB(
                        16, 10, 16, 6
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text(
                            'Kaki quick filters',
                            style: TextStyle(
                              fontWeight: FontWeight.w700,
                            ),
                          ),
                          const SizedBox(height: 8),
                          Wrap(
                            spacing: 6,
                            runSpacing: 4,
                            children: [
                              for (final label in const [
                                'All',
                                'Favorites',
                                'Videos',
                                'Photos',
                                'Favorite Videos',
                                'Favorite Photos',
                                'This Month',
                                'This Month Photos',
                                'Screenshots (filename)',
                              ])
                                ActionChip(
                                  label: Text(label),
                                  onPressed: () =>
                                      applyKakiFilter(label),
                                ),
                            ],
                          ),
                          const SizedBox(height: 6),
                          Row(
                            children: [
                              const Expanded(
                                child: Text('Saved quick filters'),
                              ),
                              TextButton.icon(
                                onPressed: () async {
                                  final current = filter.value;
                                  final now = DateTime.now();

                                  final isThisMonth =
                                      current.date.takenAfter != null &&
                                      current.date.takenAfter!.year ==
                                          now.year &&
                                      current.date.takenAfter!.month ==
                                          now.month;

                                  final name = isThisMonth
                                      ? (current.mediaType ==
                                              AssetType.image
                                          ? 'This Month Photos'
                                          : 'This Month')
                                      : current.display.isFavorite
                                          ? (current.mediaType ==
                                                  AssetType.video
                                              ? 'Favorite Videos'
                                              : current.mediaType ==
                                                      AssetType.image
                                                  ? 'Favorite Photos'
                                                  : 'Favorites')
                                          : current.mediaType ==
                                                  AssetType.video
                                              ? 'Videos'
                                              : current.mediaType ==
                                                      AssetType.image
                                                  ? 'Photos'
                                                  : current.filename ==
                                                          'Screenshot'
                                                      ? 'Screenshots (filename)'
                                                      : '';

                                  if (name.isEmpty ||
                                      kakiPresets.value.contains(name)) {
                                    return;
                                  }

                                  final items = [
                                    ...kakiPresets.value,
                                    name,
                                  ];

                                  await kakiStorage.write(
                                    key: 'kaki.saved_filters.v1',
                                    value: items.join('|'),
                                  );

                                  kakiPresets.value = items;
                                },
                                icon: const Icon(
                                  Icons.bookmark_add_outlined,
                                ),
                                label: const Text('Save current'),
                              ),
                            ],
                          ),
                          Wrap(
                            spacing: 6,
                            runSpacing: 4,
                            children: [
                              for (final saved in kakiPresets.value)
                                InputChip(
                                  label: Text(saved),
                                  onPressed: () =>
                                      applyKakiFilter(saved),
                                  onDeleted: () async {
                                    final items = [
                                      ...kakiPresets.value
                                    ]..remove(saved);

                                    await kakiStorage.write(
                                      key: 'kaki.saved_filters.v1',
                                      value: items.join('|'),
                                    );

                                    kakiPresets.value = items;
                                  },
                                ),
                            ],
                          ),
                        ],
                      ),
                    ),
                  ),
                  SliverPadding(''',
          )

          # FEATURE 3: BACKUP HEALTH DASHBOARD
          # Read existing backup state without modifying upload engine.

          upload_file = 'lib/pages/backup/upload_detail.page.dart'

          edit(
              upload_file,
              "import 'package:immich_mobile/providers/backup/backup.provider.dart';",
              "import 'package:immich_mobile/providers/backup/backup.provider.dart';\n"
              "import 'package:immich_mobile/providers/user.provider.dart';",
          )

          edit(
              upload_file,
              '    final uploadItems = ref.watch(backupProvider.select((state) => state.uploadItems));',
              '''    final backupState = ref.watch(backupProvider);
              final uploadItems = ref.watch(
                backupProvider.select(
                  (state) => state.uploadItems
                )
              );''',
          )

          edit(
              upload_file,
              '''      body: _buildTwoSectionLayout(context, uploadingItems, failedItems, iCloudProgress),''',
              '''      body: Column(
                children: [
                  Card(
                    margin: const EdgeInsets.fromLTRB(
                      16, 8, 16, 4
                    ),
                    child: Padding(
                      padding: const EdgeInsets.all(12),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text(
                            'Kaki Backup Health',
                            style: TextStyle(
                              fontSize: 17,
                              fontWeight: FontWeight.w700,
                            ),
                          ),
                          const SizedBox(height: 8),
                          Wrap(
                            spacing: 14,
                            runSpacing: 8,
                            children: [
                              Text(
                                'Backed up: ${backupState.backupCount}'
                              ),
                              Text(
                                'Remaining: ${backupState.remainderCount}'
                              ),
                              Text(
                                'Uploading: ${uploadingItems.length}'
                              ),
                              Text(
                                'Failed: ${failedItems.length}'
                              ),
                            ],
                          ),
                          const SizedBox(height: 6),
                          Text(
                            backupState.isSyncing
                                ? 'Sync in progress'
                                : 'Sync is not currently running',
                          ),
                          Align(
                            alignment: Alignment.centerRight,
                            child: TextButton.icon(
                              onPressed: () async {
                                final user =
                                    ref.read(currentUserProvider);
                                if (user != null) {
                                  await ref
                                      .read(backupProvider.notifier)
                                      .getBackupStatus(user.id);
                                }
                              },
                              icon: const Icon(Icons.refresh),
                              label: const Text('Refresh counts'),
                            ),
                          ),
                          const Text(
                            'For failed uploads, return to Backup '
                            'and use the existing backup controls.',
                            style: TextStyle(fontSize: 12),
                          ),
                        ],
                      ),
                    ),
                  ),
                  Expanded(
                    child: _buildTwoSectionLayout(
                      context,
                      uploadingItems,
                      failedItems,
                      iCloudProgress,
                    ),
                  ),
                ],
              ),''',
          )

          print('Kaki changes prepared.')
          KAKI_PATCH_SCRIPT

      - name: Build Kaki Android debug APK
        working-directory: mobile
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload Kaki APK
        uses: actions/upload-artifact@v4
        with:
          name: kaki-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
